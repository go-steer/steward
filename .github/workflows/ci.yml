# CI runs the exact same presubmit scripts as `dev/tools/ci` locally, so
# a green local run is the green remote run. No paths-ignore: the Go
# pipeline is fast and runs on every PR (docs-only PRs pass it too), so
# no companion "docs stub" workflow is needed to satisfy branch
# protection.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # apidiff runs in its own workflow — it needs the full history for
      # the baseline tag, and it is deliberately not a required check.
      # Skipping it by label here keeps the step list itself in
      # dev/tools/ci, so the local sweep can't drift from this one.
      STEWARD_CI_SKIP: apidiff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: presubmits (dev/tools/ci)
        run: dev/tools/ci
